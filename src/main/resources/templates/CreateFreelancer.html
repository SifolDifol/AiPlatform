<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
</head>
<body>
<header th:insert="/index"></header>
<div>
    <form action="/Create" method="post">
        <table border="1" cellpadding="5" cellspacing="1">
            <tr><td><span><input type="Integer" name="id" placeholder="Введите id новой создаваемой задачи"></span></td></tr>
            <tr><td><span><input type="text" name="name" placeholder="Введите имя новой задачи"></span></td></tr>
            <tr><td><span><input type="text" name="description" placeholder="Введите описание новой задачи"></span></td></tr>
            <tr><td><span><button type="submit" >Добавить</button></span></td>
        </table>
    </form>
</body>
</html>
